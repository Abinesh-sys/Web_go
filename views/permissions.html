<h1>Permission</h1>

<!-- Assign Permission -->
<form action="/manage_permissions" method="POST">
    <select name="role_id">
        {{ range .Roles }}
            <option value="{{ .ID }}"></option>
        {{ end }}
    </select>
    <input type="text" name="permission_name" placeholder="Enter Permission Name" required>
    <button type="submit">Assign Permission</button>
</form>

<!-- Permission List -->
<h2>Permissions</h2>
<div>
    
            <div class="contact-card">
                <p><strong>Permission:</strong> </p>
                <p><strong>Role:</strong> </p>
            </div>
        

</div>
